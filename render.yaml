services:
  - type: web
    name: debojit-portfolio-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: debojitdey037@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
